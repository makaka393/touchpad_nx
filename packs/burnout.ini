; Burnout Paradise Remastered — набор кнопок TouchPad.
; Экран 1280x720, x вправо, y вниз. Описание формата: docs/PACKS.md
;
; Кнопки игры (по месту, как на других приставках):
;   ZR — газ                  ZL — тормоз, задний ход
;   B (нижняя) — буст         Y (левая) и A (правая) — ручник
;   X (верхняя) — вид камеры  L+R — Showtime          ZL+ZR на светофоре — начать заезд
;   вправо на крестовине — Easy Drive                 − карта, + пауза
;
; Газ держит один большой палец, поэтому буст и ручник сделаны вместе с газом: палец съезжает
; с газа на буст, и газ не отпускается.

[pack]
name=Burnout Paradise
author=makaka393
games=0100DBF01000A000
start=drive

; ---------------------------------------------------------------- езда
[drive]
name=Drive
menu=640,44
; руль: стик появляется под левым пальцем
stick_l=200,520,105 | zone=0,330,430,720
; оглядеться: палец в свободном месте справа
stick_r=900,330,90 | zone=580,100,1280,720 | hint=0

; главная кнопка и первый ряд
btn=ZR    | 1128,568,68 | icon=gas
btn=ZR+B  | 980,540,46 | icon=bolt
btn=ZL    | 940,648,46 | icon=brake
btn=ZR+Y  | 1074,437,46 | icon=handbrake
btn=ZL+ZR | 1201,379,46 | icon=flag
; второй ряд
btn=X     | 929,393,38 | icon=camera
btn=L+R   | 1085,281,38 | icon=fire

btn=MINUS  | 60,52,30 | icon=map | goto=menu
btn=DRIGHT | 136,52,30 | icon=right | goto=menu
btn=NONE   | 716,44,26 | icon=list | goto=menu
btn=PLUS   | 1220,52,30 | icon=pause | goto=menu

; ---------------------------------------------------------------- меню, карта, Easy Drive
[menu]
name=Menu
menu=640,44
dpad=200,520,120
stick_l=200,250,80
stick_r=800,330,90 | zone=480,120,900,620 | hint=0

btn=A | 1128,568,68 | icon=ok
btn=B | 940,648,46 | icon=back
btn=Y | 980,540,46
btn=X | 1074,437,46
btn=ZL | 92,62,78,40
btn=L  | 278,62,78,40
btn=R  | 1002,62,78,40
btn=ZR | 1188,62,78,40
btn=MINUS | 456,46,30
btn=HOME  | 548,46,30
btn=PLUS  | 824,46,30
btn=NONE  | 640,664,38 | icon=play | goto=back
