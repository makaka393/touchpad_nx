; Luigi's Mansion 3 — набор кнопок TouchPad.
; Экран 1280x720, x вправо, y вниз. Описание формата: docs/PACKS.md
;
; Кнопки игры:
;   ZR — втягивать            ZL — выдувать            ZL+ZR — рывок вверх (Burst)
;   A  — вспышка (держать — зарядить), удар призраком об пол
;   Y  — вантуз (Suction Shot)
;   X  — открыть, осмотреть; держать — тёмный свет (Dark-Light)
;   B  — бег (держать)        нажатие правого стика — Гуиджи
;   −  — карта                +  — пауза
;
; Пылесос наводится правым стиком, пока кнопка зажата, поэтому почти все кнопки правой руки
; ведут стик за пальцем: зажал «втягивать» и повёл — Луиджи поворачивается туда же.

[pack]
name=Luigi's Mansion 3
author=makaka393
games=0100DCA0064A6000
start=play

; ---------------------------------------------------------------- игра
[play]
name=Play
menu=640,44
; ходьба: стик появляется под левым пальцем
stick_l=200,520,105 | zone=0,330,430,720
; повернуть пылесос, ничего не нажимая: палец в свободном месте справа
stick_r=900,330,90 | zone=580,100,1280,720 | hint=0

; главная кнопка и первый ряд
btn=ZR | 1128,568,68 | icon=suck | drag=rs
btn=ZL | 940,648,46 | icon=blow | drag=rs
btn=A  | 980,540,46 | icon=bulb | drag=rs
btn=Y  | 1074,437,46 | icon=aim | drag=rs
btn=X  | 1201,379,46 | icon=eye | drag=rs
; второй ряд
btn=ZL+ZR | 838,560,38 | icon=fire
btn=X  | 929,393,38 | icon=hand
btn=RS | 1085,281,38 | icon=ghost

; бег защёлкивается: тап включил, тап выключил
btn=B     | 60,250,32 | icon=run | mode=toggle
btn=MINUS | 60,52,30 | icon=map | goto=menu
btn=NONE  | 716,44,26 | icon=list | goto=menu
btn=PLUS  | 1220,52,30 | icon=pause | goto=menu

; ---------------------------------------------------------------- меню, карта, магазин
[menu]
name=Menu
menu=640,44
dpad=200,520,120
stick_l=200,250,80
stick_r=800,330,90 | zone=480,120,900,620 | hint=0

btn=A | 1128,568,68 | icon=ok
btn=B | 940,648,46 | icon=back
btn=Y | 980,540,46
btn=X | 1074,437,46
btn=ZL | 92,62,78,40
btn=L  | 278,62,78,40
btn=R  | 1002,62,78,40
btn=ZR | 1188,62,78,40
btn=MINUS | 456,46,30
btn=HOME  | 548,46,30
btn=PLUS  | 824,46,30
btn=NONE  | 640,664,38 | icon=play | goto=back
